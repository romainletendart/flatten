[package]
name = "flatten"
version = "0.1.0"
edition = "2024"

[lints.clippy]
single_match = "warn"
single_match_else = "warn"
needless_match = "warn"
needless_late_init = "warn"
redundant_pattern_matching = "warn"
redundant_pattern = "warn"
redundant_guards = "warn"
collapsible_match = "warn"
match_single_binding = "warn"
match_same_arms = "warn"
match_ref_pats = "warn"
match_bool = "warn"
unwrap_used = "warn"
expect_used = "warn"
pedantic = "warn"
manual_string_new = "warn"

[dependencies]
anyhow = "1.0.100"
serde_json = "1.0.145"
